<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis v2.0</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b12;
        --panel: #101826;
        --line: #1f2a3d;
        --text: #e7eefc;
        --muted: #8aa0c4;
        --accent: #3ee0c5;
        --warn: #ffb020;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #143047 0%, var(--bg) 45%);
        color: var(--text);
        min-height: 100vh;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 14px;
        color: var(--accent);
        margin: 0 0 8px;
      }
      p.lead { margin: 0 0 24px; color: var(--muted); }
      form {
        display: grid;
        gap: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 16px;
        border-radius: 12px;
      }
      textarea, input {
        width: 100%;
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }
      textarea { min-height: 90px; resize: vertical; }
      button {
        justify-self: start;
        background: var(--accent);
        color: #04231c;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: wait; }
      pre {
        white-space: pre-wrap;
        background: #0b1220;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        min-height: 160px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
      .spoken {
        font-size: 18px;
        line-height: 1.45;
        min-height: 72px;
      }

    </style>
  </head>
  <body>
    <main>
      <h1>Jarvis v2.0 · Supervisor</h1>
      <p class="lead">Delegación a Code, Comms, Shop o General. Escribe en español.</p>
      <form id="f">
        <label>
          Sesión
          <input id="session" value="ui-demo" />
        </label>
        <label>
          Prompt
          <textarea id="message">¿Cuánto es 17 * 24?</textarea>
        </label>
        <div class="row">
          <button type="submit" id="go">Ejecutar</button>
          <button type="button" class="ghost" id="voice">Simular voz</button>
          <button type="button" class="ghost" id="mic">Micrófono</button>
        </div>
      </form>
      <p class="meta">Voz (Vapi Custom LLM → Cartesia/TTS) <span id="agent" class="badge"></span></p>
      <pre id="spoken" class="spoken">Sistema listo. Dime en qué te ayudo.</pre>
      <p class="meta">JSON técnico</p>
      <pre id="out">Listo.</pre>
    </main>
    <script>
      const form = document.getElementById("f");
      const out = document.getElementById("out");
      const agent = document.getElementById("agent");
      const spoken = document.getElementById("spoken");
      const voiceBtn = document.getElementById("voice");
      const micBtn = document.getElementById("mic");
      const go = document.getElementById("go");

      function speak(text) {
        spoken.textContent = text;
        if (!window.speechSynthesis) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "es-ES";
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      }

      async function invokeVoice(text) {
        const res = await fetch("/webhooks/vapi-llm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: document.getElementById("session").value,
            messages: [
              { role: "system", content: "voice" },
              { role: "user", content: text },
            ],
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        const line = data.choices?.[0]?.message?.content || "Sin respuesta.";
        speak(line);
        return data;
      }

      voiceBtn.addEventListener("click", async () => {
        voiceBtn.disabled = true;
        spoken.textContent = "Escuchando al Supervisor…";
        try {
          await invokeVoice(document.getElementById("message").value);
        } catch (err) {
          spoken.textContent = String(err);
        } finally {
          voiceBtn.disabled = false;
        }
      });

      micBtn.addEventListener("click", () => {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Rec) {
          spoken.textContent = "Este navegador no expone reconocimiento de voz. Usa Simular voz.";
          return;
        }
        const rec = new Rec();
        rec.lang = "es-ES";
        rec.onresult = async (event) => {
          const text = event.results[0][0].transcript;
          document.getElementById("message").value = text;
          spoken.textContent = "Te escuché. Procesando…";
          try {
            await invokeVoice(text);
          } catch (err) {
            spoken.textContent = String(err);
          }
        };
        rec.start();
        spoken.textContent = "Habla ahora…";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        go.disabled = true;
        out.textContent = "Procesando…";
        agent.textContent = "";
        try {
          const res = await fetch("/invoke", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: document.getElementById("message").value,
              session_id: document.getElementById("session").value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || res.statusText);
          agent.textContent = data.agent ? `· ${data.agent}` : "";
          out.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          out.textContent = String(err);
        } finally {
          go.disabled = false;
        }
      });
    </script>
  </body>
</html>

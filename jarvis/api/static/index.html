<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f172a" />
    <title>J.A.R.V.I.S. · Neural Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Roboto", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["Fira Code", "Share Tech Mono", "Courier New", "ui-monospace", "monospace"],
              hud: ["Orbitron", "Share Tech Mono", "Fira Code", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      /* Los `animate-[spin_...]` de los anillos usan estos keyframes: declararlos aquí
         evita depender de que el CDN de Tailwind los emita. */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Solo mueve: si animara opacity pisaría la que pone el JS para ocultar la
         bandera en reposo, porque las animaciones ganan a los estilos inline. */
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 1px); }
        40% { transform: translate(2px, -1px); }
        60% { transform: translate(-1px, -2px); }
        80% { transform: translate(1px, 2px); }
      }
      /* `animate-pulse` solo baja al 50 % de opacidad en 2 s: en un bloque de 8 px
         eso no se lee como un cursor de consola, así que enciende y apaga. */
      @keyframes caret {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      .animate-caret { animation: caret 1.1s steps(1, end) infinite; }
      .animate-glitch { animation: glitch 1.8s steps(2, end) infinite; }
      /* 100vh en Safari iOS incluye la barra del navegador y deja el dock tapado;
         dvh mide lo que de verdad se ve. */
      @supports (height: 100dvh) {
        .app-shell { height: 100dvh; }
      }
      /* Resplandor azul detrás del núcleo, como el fondo de la referencia. */
      .core-glow {
        background: radial-gradient(
          circle at 50% 46%,
          rgba(37, 99, 235, 0.32) 0%,
          rgba(8, 47, 73, 0.28) 28%,
          rgba(15, 23, 42, 0) 62%
        );
      }
      /* Los anillos discontinuos solo giran cuando Jarvis habla o escucha; en
         reposo se quedan quietos y la vida la pone la esfera. Sentidos opuestos
         entre el exterior y el medio. */
      .ring-spin { animation-play-state: paused; }
      [data-voice="connecting"] .ring-spin,
      [data-voice="listening"] .ring-spin,
      [data-voice="speaking"] .ring-spin { animation-play-state: running; }
      @media (prefers-reduced-motion: reduce) {
        .ring-spin, .ring-arcs { animation-play-state: paused !important; }
      }
      /* Modo investigación: el HUD de anillos se apaga y encoge, y en su sitio entra
         la red neuronal. Lo gobierna data-researching, que pone hud.js. */
      [data-hud="rings"], [data-hud="net"] {
        transition: opacity 0.7s ease-out, transform 0.7s ease-out;
      }
      [data-researching="1"] [data-hud="rings"] { opacity: 0; transform: scale(0.9); }
      [data-researching="0"] [data-hud="net"] { opacity: 0; transform: scale(1.06); }
      #researchBanner { transition: opacity 0.7s ease-out; }
    </style>
  </head>
  <body class="h-screen w-full overflow-hidden bg-slate-950 font-sans text-white antialiased">
    <div
      id="app"
      class="app-shell relative isolate flex h-screen w-full items-center justify-center overflow-hidden bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900"
    >
      <div class="core-glow pointer-events-none absolute inset-0 -z-10"></div>

      <!-- Ondas tenues que cruzan el centro, detrás de la esfera. -->
      <svg
        class="pointer-events-none absolute inset-0 -z-10 h-full w-full text-cyan-500/10"
        viewBox="0 0 400 800"
        preserveAspectRatio="xMidYMid slice"
        fill="none"
        stroke="currentColor"
        stroke-width="0.8"
        aria-hidden="true"
      >
        <path d="M-20 420 C 80 380, 160 470, 260 430 S 400 380, 440 410" />
        <path d="M-20 440 C 90 400, 170 490, 270 450 S 410 400, 440 430" />
        <path d="M-20 460 C 100 420, 180 510, 280 470 S 420 420, 440 450" />
        <path d="M-20 480 C 110 440, 190 530, 290 490 S 430 440, 440 470" />
      </svg>

      <!-- Pistas de circuito impreso en las esquinas. La de abajo a la derecha es la
           misma figura girada 180°: un solo dibujo que mantener. -->
      <svg
        class="pointer-events-none absolute left-0 top-0 h-52 w-52 text-cyan-500/20 md:h-72 md:w-72"
        viewBox="0 0 200 200"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M0 22 H58 L78 42 V92" />
        <circle cx="78" cy="98" r="4" />
        <path d="M0 46 H38 L54 62 V120 L70 136 H108" />
        <circle cx="114" cy="136" r="4" />
        <path d="M22 0 V28 L36 42 V70" />
        <rect x="32" y="72" width="8" height="8" />
        <path d="M52 0 V14 L66 28 H120 L140 48" />
        <circle cx="145" cy="53" r="4" />
        <path d="M0 82 H14 L24 92 V160" />
        <circle cx="24" cy="166" r="3" />
        <path d="M92 0 V10 L106 24 V44" />
        <rect x="102" y="46" width="8" height="8" />
        <path d="M0 110 H30 L40 120 H60" />
        <circle cx="66" cy="120" r="3" />
        <circle cx="130" cy="18" r="12" stroke-dasharray="5 4" />
        <circle cx="130" cy="18" r="5" />
        <rect x="160" y="8" width="5" height="5" fill="currentColor" stroke="none" />
        <rect x="172" y="8" width="5" height="5" fill="currentColor" stroke="none" />
        <rect x="8" y="182" width="5" height="5" fill="currentColor" stroke="none" />
        <rect x="8" y="170" width="5" height="5" fill="currentColor" stroke="none" />
      </svg>
      <svg
        class="pointer-events-none absolute bottom-0 right-0 h-52 w-52 rotate-180 text-cyan-500/20 md:h-72 md:w-72"
        viewBox="0 0 200 200"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M0 22 H58 L78 42 V92" />
        <circle cx="78" cy="98" r="4" />
        <path d="M0 46 H38 L54 62 V120 L70 136 H108" />
        <circle cx="114" cy="136" r="4" />
        <path d="M22 0 V28 L36 42 V70" />
        <rect x="32" y="72" width="8" height="8" />
        <path d="M52 0 V14 L66 28 H120 L140 48" />
        <circle cx="145" cy="53" r="4" />
        <path d="M0 82 H14 L24 92 V160" />
        <circle cx="24" cy="166" r="3" />
        <path d="M92 0 V10 L106 24 V44" />
        <rect x="102" y="46" width="8" height="8" />
        <path d="M0 110 H30 L40 120 H60" />
        <circle cx="66" cy="120" r="3" />
        <circle cx="130" cy="18" r="12" stroke-dasharray="5 4" />
        <circle cx="130" cy="18" r="5" />
        <rect x="160" y="8" width="5" height="5" fill="currentColor" stroke="none" />
        <rect x="172" y="8" width="5" height="5" fill="currentColor" stroke="none" />
        <rect x="8" y="182" width="5" height="5" fill="currentColor" stroke="none" />
        <rect x="8" y="170" width="5" height="5" fill="currentColor" stroke="none" />
      </svg>

      <header
        class="absolute inset-x-0 top-0 z-20 flex items-start justify-between gap-3 px-4 pt-[max(0.75rem,env(safe-area-inset-top))]"
      >
        <div>
          <h1 class="font-hud text-[11px] font-black tracking-[0.28em] text-cyan-300 md:text-sm">
            JARVIS NEURAL CORE
          </h1>
          <span id="link" class="mt-1 block font-mono text-[10px] uppercase tracking-widest text-cyan-500/80">
            SISTEMAS EN LÍNEA
          </span>
        </div>
        <div id="inboxPanel" class="flex items-center gap-2 transition-opacity duration-700" aria-label="Bandeja de entrada">
          <div class="flex flex-col items-center rounded-sm border border-cyan-500/30 bg-cyan-900/20 px-2 py-1">
            <span class="text-[9px] uppercase tracking-widest text-slate-400">WhatsApp</span>
            <b id="countWa" class="font-mono text-base font-black text-cyan-300">0</b>
          </div>
          <div class="flex flex-col items-center rounded-sm border border-cyan-500/30 bg-cyan-900/20 px-2 py-1">
            <span class="text-[9px] uppercase tracking-widest text-slate-400">Correo</span>
            <b id="countMail" class="font-mono text-base font-black text-cyan-300">0</b>
          </div>
          <div class="flex flex-col items-center rounded-sm border border-cyan-500/30 bg-cyan-900/20 px-2 py-1">
            <span class="text-[9px] uppercase tracking-widest text-slate-400">Total</span>
            <b id="countTotal" class="font-mono text-base font-black text-cyan-300">0</b>
          </div>
        </div>
      </header>

      <!-- El dock de abajo es más alto que la cabecera: el núcleo sube un poco para
           quedar centrado en el hueco libre, no en la pantalla geométrica. -->
      <section id="corePanel" class="relative z-10 flex -translate-y-10 flex-col items-center md:-translate-y-6">
        <div
          id="holoCore"
          data-voice="idle"
          data-researching="0"
          class="relative h-72 w-72 md:h-96 md:w-96"
        >
          <div
            id="corePing"
            class="pointer-events-none absolute inset-6 hidden rounded-full bg-cyan-500/10 animate-ping"
          ></div>

          <!-- HUD de anillos: se desvanece cuando entra la red neuronal. -->
          <div data-hud="rings" class="absolute inset-0">
            <canvas data-hud="globe" class="absolute inset-0 h-full w-full"></canvas>
            <!-- Anillo exterior: el JS lo escala con el volumen; el giro va en el hijo. -->
            <div data-hud="ring-outer" class="absolute inset-0 will-change-transform transition-opacity duration-300">
              <div
                class="ring-spin absolute inset-0 rounded-full border-2 border-dashed border-cyan-500/50 animate-[spin_14s_linear_infinite]"
              ></div>
            </div>
            <div class="pointer-events-none absolute inset-3 rounded-full border border-cyan-500/50"></div>
            <div data-hud="ring-mid" class="absolute inset-8 will-change-transform md:inset-12">
              <div
                class="ring-spin absolute inset-0 rounded-full border border-dashed border-blue-500/30 animate-[spin_20s_linear_infinite] [animation-direction:reverse]"
              ></div>
            </div>
            <div class="pointer-events-none absolute inset-14 rounded-full border border-blue-500/30 md:inset-20"></div>
            <!-- Arcos rotos, como los del HUD de la referencia. -->
            <svg
              class="ring-arcs pointer-events-none absolute inset-1 animate-[spin_30s_linear_infinite]"
              viewBox="0 0 100 100"
              fill="none"
              aria-hidden="true"
            >
              <circle cx="50" cy="50" r="47" stroke="rgba(34, 211, 238, 0.55)" stroke-width="1.2" stroke-dasharray="42 26 12 70 30 115" />
              <circle cx="50" cy="50" r="41" stroke="rgba(59, 130, 246, 0.35)" stroke-width="0.8" stroke-dasharray="90 40 20 108" />
            </svg>
          </div>

          <!-- Red neuronal del modo investigación: ocupa el sitio de los anillos. -->
          <canvas data-hud="net" class="pointer-events-none absolute inset-0 h-full w-full rounded-full"></canvas>

          <button
            type="button"
            id="talkBtn"
            class="absolute inset-0 z-10 flex items-center justify-center rounded-full transition-transform duration-300 ease-out active:scale-95"
            aria-label="Hablar con J.A.R.V.I.S"
          >
            <span
              id="coreLabel"
              data-hud="label"
              class="relative z-10 font-hud text-xl font-bold tracking-widest text-white drop-shadow-[0_0_10px_rgba(6,182,212,0.8)] md:text-3xl"
            >
              J.A.R.V.I.S
            </span>
          </button>
        </div>
        <p id="talkStatus" class="mt-3 max-w-xs text-center font-mono text-xs tracking-wide text-slate-400 md:text-sm">
          Pulsa J.A.R.V.I.S para conversar.
        </p>
        <p
          id="researchBanner"
          class="animate-glitch pointer-events-none mt-2 px-4 text-center font-hud text-[11px] font-black tracking-[0.3em] text-cyan-300 opacity-0 drop-shadow-[0_0_14px_rgba(6,182,212,0.85)] md:text-sm"
        >
          ACCEDIENDO A LA RED GLOBAL...
        </p>
      </section>

      <footer
        class="absolute inset-x-0 bottom-0 z-20 flex flex-col gap-2 px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] md:mx-auto md:max-w-3xl"
      >
        <section
          id="terminalPanel"
          class="flex min-h-0 flex-col rounded-sm border border-cyan-500/20 bg-slate-950/70 p-3 transition-opacity duration-700"
        >
          <div class="mb-1 flex items-baseline justify-between gap-2">
            <h2 class="font-hud text-[10px] font-black uppercase tracking-[0.2em] text-cyan-400">
              Terminal del Supervisor
            </h2>
            <span class="font-mono text-[10px] tracking-widest text-cyan-500/60">tty/supervisor</span>
          </div>
          <pre
            id="terminal"
            class="max-h-[22vh] overflow-y-auto whitespace-pre-wrap break-words font-mono text-[12px] leading-relaxed text-cyan-100/90 md:text-[13px]"
          ><span id="terminalText">J.A.R.V.I.S. listo. Pulsa el núcleo o escribe una directiva.</span>
<span class="text-cyan-400">supervisor@jarvis:~$ </span><span id="terminalCaret" class="animate-caret inline-block h-4 w-2 bg-cyan-400 align-text-bottom" aria-hidden="true"></span></pre>
        </section>

        <form id="directiveForm" class="flex w-full gap-2">
          <input
            id="commandInput"
            autocomplete="off"
            placeholder="Escribe una directiva… ¿Cuánto es 17 * 24?"
            class="min-w-0 flex-1 rounded-sm border border-cyan-500/30 bg-slate-950/70 px-4 py-2 font-mono text-sm text-white outline-none placeholder:text-slate-500 focus:border-cyan-400/70"
          />
          <button
            class="shrink-0 rounded-sm border border-cyan-400/60 bg-gradient-to-br from-cyan-500 to-blue-600 px-4 py-2 font-hud text-xs font-black tracking-wide text-slate-950 transition-all duration-300 ease-out hover:scale-105 active:scale-95"
            type="submit"
            id="send"
          >
            ENVIAR
          </button>
        </form>
      </footer>
    </div>

    <script src="/static/format-error.js"></script>
    <script src="/static/hud.js"></script>
    <script>
      const terminal = document.getElementById("terminal");
      // Solo el texto del log se reescribe: el prompt con el cursor vive aparte
      // dentro del <pre> y sobrevive a cada línea nueva.
      const terminalText = document.getElementById("terminalText");
      const input = document.getElementById("commandInput");
      const send = document.getElementById("send");
      const talkBtn = document.getElementById("talkBtn");
      const talkStatus = document.getElementById("talkStatus");
      const countWa = document.getElementById("countWa");
      const countMail = document.getElementById("countMail");
      const countTotal = document.getElementById("countTotal");
      const inboxPanel = document.getElementById("inboxPanel");
      const terminalPanel = document.getElementById("terminalPanel");
      const researchBanner = document.getElementById("researchBanner");
      const corePing = document.getElementById("corePing");
      const coreLabel = document.getElementById("coreLabel");

      // El núcleo es un componente aparte (hud.js): aquí solo se le cuenta el estado.
      const hud = createHoloCore(document.getElementById("holoCore"));

      const CORE_LABEL = "J.A.R.V.I.S";
      const UNLOCK_LABEL = "INICIAR SISTEMA";
      // El texto vive en su propio span: así los anillos del núcleo no se borran al
      // cambiar de estado. El brillo lo modula hud.js con el volumen.
      const LABEL_BASE = "relative z-10 font-hud font-bold text-white";
      const LABEL_WIDE =
        `${LABEL_BASE} text-xl tracking-widest drop-shadow-[0_0_10px_rgba(6,182,212,0.8)] md:text-3xl`;
      const LABEL_TIGHT =
        `${LABEL_BASE} text-xs tracking-[0.18em] drop-shadow-[0_0_10px_rgba(6,182,212,0.8)] md:text-base`;
      const LABEL_LIVE =
        `${LABEL_BASE} text-xl tracking-widest text-cyan-50 drop-shadow-[0_0_18px_rgba(6,182,212,1)] md:text-3xl`;

      const RESEARCH_TOOLS = [
        "web_search",
        "extract_social_profiles",
        "find_public_emails",
        "advanced_dork_search",
        "find_contact_info",
        "username_lookup",
      ];
      const RESEARCH_MSG_TYPES = new Set([
        "function-call",
        "function-call-start",
        "tool-calls",
        "tool-call",
        "tool_calls",
      ]);
      const RESEARCH_DONE_TYPES = new Set([
        "function-call-result",
        "tool-calls-result",
        "tool-call-result",
        "tool_call_result",
      ]);

      let vapi = null;
      let voiceCfg = {};
      let inCall = false;
      let isCallActive = false;
      let callStatus = "idle";
      let talkMode = "browser";
      let lastVapiError = "";
      let voiceBusy = false;
      let clientResearching = false;
      let serverResearching = false;
      let needsManualStart = false;

      function isResearching() {
        return clientResearching || serverResearching;
      }

      function applyCoreVisuals() {
        // Las ondas solo salen con la llamada viva o en búsqueda profunda.
        const live = isCallActive || isResearching();
        corePing.classList.toggle("hidden", !live);
        hud.setVoice(callStatus);
        hud.setResearching(isResearching());
      }

      function setCallStatus(status) {
        callStatus = status;
        isCallActive = status !== "idle";
        inCall = isCallActive;
        applyCoreVisuals();
      }
      window.setCallStatus = setCallStatus;

      function setResearching(active, source) {
        if (source === "server") serverResearching = Boolean(active);
        else clientResearching = Boolean(active);
        const deep = isResearching();
        researchBanner.style.opacity = deep ? "1" : "0";
        inboxPanel.style.opacity = deep ? "0.15" : "";
        terminalPanel.style.opacity = deep ? "0.35" : "";
        applyCoreVisuals();
      }
      window.setResearching = setResearching;

      const terminalMessages = [
        "J.A.R.V.I.S. listo. Pulsa el núcleo o escribe una directiva.",
      ];

      function log(line) {
        terminalMessages.push(String(line));
        terminalText.textContent = terminalMessages.join("\n");
        terminal.scrollTop = terminal.scrollHeight;
      }

      function setTalk(label, live) {
        const text = label || CORE_LABEL;
        const unlock = text === UNLOCK_LABEL;
        coreLabel.textContent = text;
        coreLabel.className = unlock ? LABEL_TIGHT : live ? LABEL_LIVE : LABEL_WIDE;
      }

      function isResearchQuery(text) {
        const t = String(text || "").toLowerCase();
        return (
          /recopilar información|información pública|informacion publica|investigar a|investiga a|buscar en google|busca en google|osint|linkedin|hunter\.io|perfiles sociales/.test(
            t
          ) ||
          (t.includes("google") && /buscar|busca|investiga|investigar/.test(t))
        );
      }

      function collectToolNames(value, bag) {
        if (!value) return;
        if (Array.isArray(value)) {
          value.forEach((item) => collectToolNames(item, bag));
          return;
        }
        if (typeof value === "object") {
          const name = value.name || value.tool || value.functionName;
          if (typeof name === "string") bag.push(name);
          if (value.function) collectToolNames(value.function, bag);
          if (value.toolCall) collectToolNames(value.toolCall, bag);
          if (value.toolCalls) collectToolNames(value.toolCalls, bag);
          if (value.tool_calls) collectToolNames(value.tool_calls, bag);
          if (value.toolCallList) collectToolNames(value.toolCallList, bag);
        }
      }

      function researchToolsIn(payload) {
        const names = [];
        collectToolNames(payload, names);
        if (Array.isArray(payload)) {
          for (const row of payload) {
            if (row && typeof row === "object" && row.tool) names.push(String(row.tool));
          }
        }
        return names.some((name) => RESEARCH_TOOLS.includes(String(name)));
      }

      function handleVapiMessage(msg) {
        if (!msg) return;
        const type = String(msg.type || "");
        if (RESEARCH_MSG_TYPES.has(type) || researchToolsIn(msg)) {
          setResearching(true);
        }
        if (RESEARCH_DONE_TYPES.has(type) && !researchToolsIn(msg)) {
          setResearching(false);
        }
        if (type === "transcript" && msg.transcript && (!msg.transcriptType || msg.transcriptType === "final")) {
          const who = msg.role === "assistant" ? "JARVIS" : "Tú";
          log(who + ": " + msg.transcript);
          if (msg.role !== "assistant" && isResearchQuery(msg.transcript)) setResearching(true);
          if (msg.role === "assistant") setResearching(false);
        }
      }

      async function refreshInbox() {
        try {
          const res = await fetch("/api/jarvis/inbox-status");
          const data = await res.json();
          countWa.textContent = data.whatsapp ?? 0;
          countMail.textContent = data.correo ?? 0;
          countTotal.textContent = data.total ?? 0;
          setResearching(Boolean(data.researching), "server");
        } catch (_err) {
          document.getElementById("link").textContent = "ENLACE INESTABLE";
        }
      }

      async function sendDirective(command, { speakAnswer } = {}) {
        const deep = isResearchQuery(command);
        if (deep) setResearching(true);
        try {
          const res = await fetch("/api/jarvis/directive", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command, session_id: "hud" }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || res.statusText);
          const answer = data.answer || (data.lines || []).slice(1).join(" ");
          (data.lines || [data.answer]).slice(1).forEach(log);
          if (speakAnswer && answer) await speak(answer);
          return answer;
        } finally {
          setResearching(false);
        }
      }

      function playUntilEnd(audio) {
        return new Promise((resolve) => {
          audio.addEventListener("ended", resolve, { once: true });
          audio.addEventListener("error", resolve, { once: true });
          audio.play().catch(resolve);
        });
      }

      // Sin Vapi no hay eventos de volumen: se marca "speaking" mientras dura el
      // audio para que el núcleo pulse con el ritmo sintético de hud.js.
      async function speak(text) {
        const wasVapi = talkMode === "vapi";
        if (!wasVapi) setCallStatus("speaking");
        try {
          const res = await fetch("/voice/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (res.ok) {
            await playUntilEnd(new Audio(URL.createObjectURL(await res.blob())));
            return;
          }
        } catch (_err) {
        } finally {
          if (!wasVapi) setCallStatus("idle");
        }
        if (!window.speechSynthesis) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "es-ES";
        if (!wasVapi) {
          setCallStatus("speaking");
          utter.onend = () => setCallStatus("idle");
          utter.onerror = () => setCallStatus("idle");
        }
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      }

      function browserSpeechSupported() {
        return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
      }

      function startBrowserVoice() {
        const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Ctor) {
          talkStatus.textContent = "Este navegador no da micrófono. Escribe abajo o configura Vapi en Render.";
          return;
        }
        const rec = new Ctor();
        rec.lang = "es-ES";
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        setCallStatus("listening");
        setTalk("ESCUCHANDO", true);
        talkStatus.textContent = "Te escucho. Habla ahora.";
        rec.onresult = async (event) => {
          const spoken = event.results[0][0].transcript;
          log("> " + spoken);
          talkStatus.textContent = "Procesando…";
          setCallStatus("connecting");
          try {
            await sendDirective(spoken, { speakAnswer: true });
          } catch (err) {
            log("ERROR " + formatError(err));
          } finally {
            // speak() ya devolvió el núcleo a reposo si llegó a hablar; si no hubo
            // respuesta o falló, no puede quedarse girando en "connecting".
            if (callStatus === "connecting") setCallStatus("idle");
          }
        };
        rec.onerror = () => {
          talkStatus.textContent = "No pude oírte. Pulsa el núcleo e inténtalo de nuevo.";
        };
        rec.onend = () => {
          if (callStatus === "listening") setCallStatus("idle");
          setTalk(CORE_LABEL, false);
          setResearching(false);
        };
        rec.start();
      }

      async function toggleVapiCall() {
        return startVapiCall({ auto: false });
      }

      function isGestureBlocked(err) {
        const name = err && err.name ? String(err.name) : "";
        const text = formatError(err).toLowerCase();
        if (name === "NotAllowedError" || name === "SecurityError" || name === "NotFoundError") return true;
        return /notallowed|permission|user gesture|autoplay|not allowed|denied|getusermedia|secure context/.test(
          text
        );
      }

      async function ensureMic() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          const err = new Error("getUserMedia no disponible");
          err.name = "NotAllowedError";
          throw err;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        for (const track of stream.getTracks()) track.stop();
      }

      function armManualStart() {
        needsManualStart = true;
        setCallStatus("idle");
        setTalk(UNLOCK_LABEL, true);
        talkStatus.textContent = "Pulsa INICIAR SISTEMA para desbloquear el audio.";
        log("SISTEMA: Requiere interacción manual para desbloquear canales de audio.");
      }

      async function connectVapiSession() {
        const llmModel = voiceCfg.custom_llm_model || {
          provider: "custom-llm",
          url: voiceCfg.custom_llm_url,
          model: "jarvis-supervisor",
          metadataSendMode: "off",
          timeoutSeconds: 90,
        };
        const transcriber = { provider: "deepgram", language: "es" };
        const voice =
          voiceCfg.cartesia_configured && voiceCfg.cartesia_voice_id
            ? {
                provider: "cartesia",
                voiceId: voiceCfg.cartesia_voice_id,
                model: voiceCfg.cartesia_model,
              }
            : { provider: "vapi", voiceId: "Elliot" };
        const assistant = {
          name: "J.A.R.V.I.S.",
          firstMessage: "Sistemas en línea. Te escucho, maestro.",
          model: llmModel,
          transcriber,
          voice,
        };
        let call = await vapi.start(assistant);
        if (!call && voiceCfg.vapi_assistant_id) {
          call = await vapi.start(voiceCfg.vapi_assistant_id, { model: llmModel, transcriber });
        }
        if (!call) {
          throw new Error(lastVapiError || "Vapi no inició la llamada.");
        }
        return call;
      }

      async function startVapiCall({ auto } = {}) {
        if (!vapi) {
          if (auto) {
            armManualStart();
            return;
          }
          return startBrowserVoice();
        }
        if (voiceBusy) return;
        if (inCall || isCallActive) {
          voiceBusy = true;
          talkStatus.textContent = "Colgando…";
          try {
            await vapi.stop();
          } catch (err) {
            log("ERROR voz " + formatError(err));
          } finally {
            voiceBusy = false;
            setCallStatus("idle");
            setTalk(CORE_LABEL, false);
            setResearching(false);
            talkStatus.textContent = "Llamada terminada. Pulsa el núcleo para continuar.";
          }
          return;
        }
        talkStatus.textContent = auto ? "Iniciando canales de voz…" : "Conectando con Jarvis…";
        setTalk(CORE_LABEL, true);
        setCallStatus("connecting");
        voiceBusy = true;
        try {
          await ensureMic();
          await connectVapiSession();
          needsManualStart = false;
        } catch (err) {
          if (auto || isGestureBlocked(err)) {
            armManualStart();
            return;
          }
          setCallStatus("idle");
          setTalk(CORE_LABEL, false);
          talkStatus.textContent = "Vapi no arrancó. Pruebo el micrófono del navegador.";
          log("ERROR voz " + formatError(err));
          startBrowserVoice();
        } finally {
          voiceBusy = false;
        }
      }

      async function bootVoice() {
        try {
          const res = await fetch("/voice/config");
          voiceCfg = await res.json();
        } catch (_err) {
          voiceCfg = {};
        }
        if (voiceCfg.vapi_public_key) {
          try {
            const mod = await import("https://esm.sh/@vapi-ai/web@2.6.3");
            const Vapi = mod.default;
            vapi = new Vapi(voiceCfg.vapi_public_key);
            vapi.on("call-start", () => {
              setCallStatus("listening");
              setTalk("COLGAR", true);
              talkStatus.textContent = "En llamada. Pulsa el núcleo para colgar.";
              log("Llamada de voz iniciada.");
            });
            vapi.on("call-end", () => {
              setCallStatus("idle");
              setTalk(CORE_LABEL, false);
              setResearching(false);
              talkStatus.textContent = "Llamada terminada. Pulsa el núcleo para continuar.";
              log("Llamada de voz finalizada.");
            });
            vapi.on("speech-start", () => {
              if (isCallActive) setCallStatus("speaking");
            });
            vapi.on("speech-end", () => {
              if (isCallActive) setCallStatus("listening");
            });
            // Nivel de audio de la llamada (0..1), varias veces por segundo: es lo que
            // convierte el anillo exterior en un ecualizador circular.
            vapi.on("volume-level", (level) => {
              hud.setVolume(level);
            });
            vapi.on("error", (err) => {
              const text = formatError(err);
              lastVapiError = text;
              console.error("ERROR Vapi", text, err);
              log("ERROR Vapi " + text);
            });
            vapi.on("message", (msg) => {
              handleVapiMessage(msg);
            });
            talkMode = "vapi";
            talkStatus.textContent = "Iniciando canales de voz…";
            await startVapiCall({ auto: true });
            return;
          } catch (err) {
            log("SDK de Vapi no cargó. " + formatError(err));
          }
        }
        talkMode = "browser";
        if (browserSpeechSupported()) {
          talkStatus.textContent = "Pulsa el núcleo (micrófono del navegador) o escribe abajo.";
        } else {
          talkStatus.textContent = "Este iPhone necesita VAPI_PUBLIC_KEY en Render para hablar. Mientras, escribe abajo.";
        }
      }

      talkBtn.addEventListener("click", () => {
        if (talkMode === "vapi") toggleVapiCall();
        else startBrowserVoice();
      });

      document.getElementById("directiveForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const command = input.value.trim();
        if (!command) return;
        send.disabled = true;
        log("> " + command);
        input.value = "";
        try {
          await sendDirective(command);
        } catch (err) {
          log("ERROR " + formatError(err));
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      // El JS es la fuente de verdad del estado del núcleo: si el HTML se desalinea,
      // este primer render lo corrige sin esperar a la primera llamada.
      setTalk(CORE_LABEL, false);
      applyCoreVisuals();
      refreshInbox();
      setInterval(refreshInbox, 1500);
      bootVoice();
    </script>
  </body>
</html>

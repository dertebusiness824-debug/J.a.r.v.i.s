<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050505" />
    <title>J.A.R.V.I.S. · Neural Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Roboto", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["Fira Code", "Courier New", "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-dvh bg-black font-sans text-white antialiased overflow-x-hidden">
    <canvas id="net" class="pointer-events-none fixed inset-0 z-0 opacity-25"></canvas>
    <div class="pointer-events-none fixed inset-0 z-0 bg-black/70"></div>

    <div class="relative z-10 mx-auto flex min-h-dvh w-full max-w-3xl flex-col md:max-w-5xl">
      <header class="flex items-center justify-between gap-3 px-4 pt-4 pb-2">
        <div>
          <h1 class="text-sm font-semibold tracking-[0.28em] text-orange-500 md:text-base">
            JARVIS NEURAL CORE
          </h1>
          <p class="mt-1 text-xs text-gray-400">Supervisor multi-agente · voz y texto</p>
        </div>
        <span id="link" class="text-[10px] font-medium uppercase tracking-widest text-orange-400">
          SISTEMAS EN LÍNEA
        </span>
      </header>

      <main class="flex flex-1 flex-col gap-4 p-4 pb-2 md:grid md:grid-cols-[240px_1fr] md:grid-rows-[auto_1fr]">
        <aside class="rounded-2xl border border-orange-500/20 bg-black/40 p-4 shadow-xl backdrop-blur-md md:row-span-2">
          <h2 class="mb-3 text-[11px] font-semibold uppercase tracking-[0.2em] text-orange-500">
            Bandeja de entrada
          </h2>
          <p class="mb-3 text-xs text-gray-400">Mensajes pendientes, sin marcar como leídos.</p>
          <div class="grid grid-cols-3 gap-2 md:grid-cols-1 md:gap-3">
            <div class="flex items-baseline justify-between rounded-xl border border-gray-700/50 bg-black/30 px-3 py-2">
              <span class="text-xs text-gray-400">WhatsApp</span>
              <b id="countWa" class="text-lg font-semibold text-white">0</b>
            </div>
            <div class="flex items-baseline justify-between rounded-xl border border-gray-700/50 bg-black/30 px-3 py-2">
              <span class="text-xs text-gray-400">Correo</span>
              <b id="countMail" class="text-lg font-semibold text-white">0</b>
            </div>
            <div class="flex items-baseline justify-between rounded-xl border border-gray-700/50 bg-black/30 px-3 py-2">
              <span class="text-xs text-gray-400">Total</span>
              <b id="countTotal" class="text-lg font-semibold text-orange-500">0</b>
            </div>
          </div>
        </aside>

        <section class="flex flex-col items-center justify-center rounded-2xl border border-orange-500/20 bg-black/40 px-4 py-6 shadow-xl backdrop-blur-md">
          <button
            type="button"
            id="talkBtn"
            class="flex h-32 w-32 shrink-0 items-center justify-center rounded-full border border-orange-400/30 bg-gradient-to-br from-orange-500 to-red-600 text-sm font-bold tracking-[0.2em] text-white shadow-[0_0_15px_rgba(249,115,22,0.5)] transition active:scale-95 md:h-36 md:w-36"
          >
            HABLAR
          </button>
          <p id="talkStatus" class="mt-4 max-w-xs text-center text-sm text-gray-400">
            Pulsa HABLAR para conversar con Jarvis.
          </p>
        </section>

        <section class="flex min-h-0 flex-col rounded-2xl border border-orange-500/20 bg-black/40 p-4 shadow-xl backdrop-blur-md">
          <h2 class="mb-2 text-[11px] font-semibold uppercase tracking-[0.2em] text-orange-500">
            Terminal del Supervisor
          </h2>
          <pre
            id="terminal"
            class="h-64 max-h-[40vh] overflow-y-auto whitespace-pre-wrap break-words font-mono text-[13px] leading-relaxed text-orange-100/90"
          >J.A.R.V.I.S. listo. Pulsa HABLAR o escribe una directiva.</pre>
        </section>
      </main>

      <form
        id="directiveForm"
        class="flex w-full gap-2 p-4 pb-[max(1rem,env(safe-area-inset-bottom))]"
      >
        <input
          id="commandInput"
          autocomplete="off"
          placeholder="Escribe una directiva… ¿Cuánto es 17 * 24?"
          class="min-w-0 flex-1 rounded-xl border border-orange-500/20 bg-black/40 px-4 py-2 text-sm text-white placeholder:text-gray-500 backdrop-blur-md outline-none focus:border-orange-500/60"
        />
        <button
          class="shrink-0 rounded-xl bg-orange-500 px-4 py-2 text-sm font-semibold tracking-wide text-black"
          type="submit"
          id="send"
        >
          ENVIAR
        </button>
      </form>
    </div>

    <script>
      const terminal = document.getElementById("terminal");
      const input = document.getElementById("commandInput");
      const send = document.getElementById("send");
      const talkBtn = document.getElementById("talkBtn");
      const talkStatus = document.getElementById("talkStatus");
      const countWa = document.getElementById("countWa");
      const countMail = document.getElementById("countMail");
      const countTotal = document.getElementById("countTotal");

      const TALK_IDLE =
        "flex h-32 w-32 shrink-0 items-center justify-center rounded-full border border-orange-400/30 bg-gradient-to-br from-orange-500 to-red-600 text-sm font-bold tracking-[0.2em] text-white shadow-[0_0_15px_rgba(249,115,22,0.5)] transition active:scale-95 md:h-36 md:w-36";
      const TALK_LIVE =
        "flex h-32 w-32 shrink-0 animate-pulse items-center justify-center rounded-full border border-red-400/40 bg-gradient-to-br from-red-600 to-red-900 text-sm font-bold tracking-[0.2em] text-white shadow-[0_0_15px_rgba(249,115,22,0.5)] shadow-red-600/60 transition active:scale-95 md:h-36 md:w-36";

      let vapi = null;
      let voiceCfg = {};
      let inCall = false;
      let talkMode = "browser";

      function formatError(error) {
        if (error == null) return "error desconocido";
        if (typeof error === "string") return error;
        if (error instanceof Error && error.message) return error.message;
        if (typeof error === "object") {
          if (typeof error.message === "string" && error.message) return error.message;
          if (typeof error.error === "string" && error.error) return error.error;
          if (error.error && typeof error.error === "object") {
            if (error.error.message) return String(error.error.message);
            try {
              return JSON.stringify(error.error, null, 2);
            } catch (_err) {}
          }
          try {
            return JSON.stringify(error, null, 2);
          } catch (_err) {
            return String(error);
          }
        }
        return String(error);
      }

      function log(line) {
        terminal.textContent += "\n" + line;
        terminal.scrollTop = terminal.scrollHeight;
      }

      function setTalk(label, live) {
        talkBtn.textContent = label;
        talkBtn.className = live ? TALK_LIVE : TALK_IDLE;
      }

      async function refreshInbox() {
        try {
          const res = await fetch("/api/jarvis/inbox-status");
          const data = await res.json();
          countWa.textContent = data.whatsapp ?? 0;
          countMail.textContent = data.correo ?? 0;
          countTotal.textContent = data.total ?? 0;
        } catch (_err) {
          document.getElementById("link").textContent = "ENLACE INESTABLE";
        }
      }

      async function sendDirective(command, { speakAnswer } = {}) {
        const res = await fetch("/api/jarvis/directive", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command, session_id: "hud" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        const answer = data.answer || (data.lines || []).slice(1).join(" ");
        (data.lines || [data.answer]).slice(1).forEach(log);
        if (speakAnswer && answer) await speak(answer);
        return answer;
      }

      async function speak(text) {
        try {
          const res = await fetch("/voice/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (res.ok) {
            const audio = new Audio(URL.createObjectURL(await res.blob()));
            await audio.play();
            return;
          }
        } catch (_err) {}
        if (!window.speechSynthesis) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "es-ES";
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      }

      function browserSpeechSupported() {
        return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
      }

      function startBrowserVoice() {
        const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Ctor) {
          talkStatus.textContent = "Este navegador no da micrófono. Escribe abajo o configura Vapi en Render.";
          return;
        }
        const rec = new Ctor();
        rec.lang = "es-ES";
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        inCall = true;
        setTalk("ESCUCHANDO", true);
        talkStatus.textContent = "Te escucho. Habla ahora.";
        rec.onresult = async (event) => {
          const spoken = event.results[0][0].transcript;
          log("> " + spoken);
          talkStatus.textContent = "Procesando…";
          try {
            await sendDirective(spoken, { speakAnswer: true });
          } catch (err) {
            log("ERROR " + formatError(err));
          }
        };
        rec.onerror = () => {
          talkStatus.textContent = "No pude oírte. Pulsa HABLAR e inténtalo de nuevo.";
        };
        rec.onend = () => {
          inCall = false;
          setTalk("HABLAR", false);
        };
        rec.start();
      }

      async function toggleVapiCall() {
        if (!vapi) return startBrowserVoice();
        if (inCall) {
          vapi.stop();
          return;
        }
        talkStatus.textContent = "Conectando con Jarvis…";
        setTalk("CONECTANDO", true);
        const llmUrl = voiceCfg.custom_llm_url;
        const overrides = {
          model: { provider: "custom-llm", url: llmUrl, model: "jarvis-supervisor" },
          transcriber: { provider: "deepgram", language: "es" },
        };
        try {
          if (voiceCfg.vapi_assistant_id) {
            await vapi.start(voiceCfg.vapi_assistant_id, overrides);
          } else {
            await vapi.start({
              name: "J.A.R.V.I.S.",
              firstMessage: "Sistemas en línea. Te escucho, señor.",
              model: overrides.model,
              transcriber: overrides.transcriber,
              voice: { provider: "vapi", voiceId: "Elliot" },
            });
          }
        } catch (err) {
          setTalk("HABLAR", false);
          talkStatus.textContent = "Vapi no arrancó. Pruebo el micrófono del navegador.";
          log("ERROR voz " + formatError(err));
          startBrowserVoice();
        }
      }

      async function bootVoice() {
        try {
          const res = await fetch("/voice/config");
          voiceCfg = await res.json();
        } catch (_err) {
          voiceCfg = {};
        }
        if (voiceCfg.vapi_public_key) {
          try {
            const mod = await import("https://esm.sh/@vapi-ai/web");
            const Vapi = mod.default;
            vapi = new Vapi(voiceCfg.vapi_public_key);
            vapi.on("call-start", () => {
              inCall = true;
              setTalk("COLGAR", true);
              talkStatus.textContent = "En llamada. Habla con Jarvis.";
              log("Llamada de voz iniciada.");
            });
            vapi.on("call-end", () => {
              inCall = false;
              setTalk("HABLAR", false);
              talkStatus.textContent = "Llamada terminada. Pulsa HABLAR para continuar.";
              log("Llamada de voz finalizada.");
            });
            vapi.on("error", (err) => {
              log("ERROR Vapi " + formatError(err));
            });
            vapi.on("message", (msg) => {
              if (!msg || msg.type !== "transcript" || !msg.transcript) return;
              if (msg.transcriptType && msg.transcriptType !== "final") return;
              const who = msg.role === "assistant" ? "JARVIS" : "Tú";
              log(who + ": " + msg.transcript);
            });
            talkMode = "vapi";
            talkStatus.textContent = "Pulsa HABLAR para una llamada de voz con Jarvis.";
            return;
          } catch (err) {
            log("SDK de Vapi no cargó. " + formatError(err));
          }
        }
        talkMode = "browser";
        if (browserSpeechSupported()) {
          talkStatus.textContent = "Pulsa HABLAR (micrófono del navegador) o escribe abajo.";
        } else {
          talkStatus.textContent = "Este iPhone necesita VAPI_PUBLIC_KEY en Render para hablar. Mientras, escribe abajo.";
        }
      }

      talkBtn.addEventListener("click", () => {
        if (talkMode === "vapi") toggleVapiCall();
        else startBrowserVoice();
      });

      document.getElementById("directiveForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const command = input.value.trim();
        if (!command) return;
        send.disabled = true;
        log("> " + command);
        input.value = "";
        try {
          await sendDirective(command);
        } catch (err) {
          log("ERROR " + formatError(err));
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      function neural() {
        const canvas = document.getElementById("net");
        const ctx = canvas.getContext("2d");
        const nodes = [];
        function resize() {
          canvas.width = innerWidth;
          canvas.height = innerHeight;
        }
        resize();
        addEventListener("resize", resize);
        for (let i = 0; i < 42; i++) {
          nodes.push({
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            vx: (Math.random() - 0.5) * 0.28,
            vy: (Math.random() - 0.5) * 0.28,
          });
        }
        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (const n of nodes) {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
            if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
          }
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i],
                b = nodes[j];
              const d = Math.hypot(a.x - b.x, a.y - b.y);
              if (d < 130) {
                ctx.strokeStyle = `rgba(249, 115, 22, ${0.18 * (1 - d / 130)})`;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
          }
          for (const n of nodes) {
            ctx.fillStyle = "rgba(249, 115, 22, 0.45)";
            ctx.beginPath();
            ctx.arc(n.x, n.y, 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(tick);
        }
        tick();
      }

      neural();
      refreshInbox();
      setInterval(refreshInbox, 4000);
      bootVoice();
    </script>
  </body>
</html>

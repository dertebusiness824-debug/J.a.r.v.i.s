services:
  - type: web
    name: jarvis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn jarvis.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: ZADARMA_KEY
        sync: false
      - key: ZADARMA_SECRET
        sync: false
      - key: ZADARMA_PBX_ID
        sync: false
      - key: WHATSAPP_BRIDGE_URL
        value: http://127.0.0.1:3000
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

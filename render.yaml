services:
  - type: web
    name: jarvis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn jarvis.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PLANNER_MODEL
        value: nousresearch/hermes-3-llama-3.1-70b
      - key: EXECUTOR_MODEL
        value: nousresearch/hermes-3-llama-3.1-70b
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        # Identificador público del asistente del panel de Vapi (no es un secreto:
        # el HUD lo recibe por /voice/config). Fijado aquí para que el despliegue
        # arranque siempre el asistente correcto.
        value: 7f5e8df0-c8b6-4fb1-97f7-8a3c24364b1b
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: ZADARMA_KEY
        sync: false
      - key: ZADARMA_SECRET
        sync: false
      - key: ZADARMA_PBX_ID
        sync: false
      - key: WHATSAPP_BRIDGE_URL
        value: http://127.0.0.1:3000
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Command Emission: el mismo valor va en tu PC (local_node.py --token).
      - key: JARVIS_NODE_TOKEN
        sync: false
      - key: HUNTERIO_API_KEY
        sync: false
